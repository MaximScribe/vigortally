# VigorTally with a separate PostgreSQL server (recommended for several users or if you
# already run Postgres).
#
#   POSTGRES_PASSWORD=change-me docker compose -f compose.postgres.yml up -d

services:
  vigortally:
    image: vigortally/vigortally:latest
    build:
      context: ..
    container_name: vigortally
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '8080:8080'
    environment:
      DATABASE_URL: postgres://vigortally:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/vigortally
      PUBLIC_URL: ''
      TZ: Europe/Berlin
    volumes:
      - ./data:/data

  db:
    image: postgres:17-alpine
    container_name: vigortally-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vigortally
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: vigortally
    volumes:
      - ./pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vigortally']
      interval: 10s
      timeout: 5s
      retries: 5
