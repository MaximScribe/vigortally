# VigorTally with a separate PostgreSQL server (recommended for several users or if you
# already run Postgres).
#
#   docker compose -f compose.postgres.yml up -d --build
#
# POSTGRES_PASSWORD must be set, in a .env file next to this one (see .env.example)
# or in the shell.

name: vigortally

services:
  vigortally:
    image: vigortally/vigortally:latest
    # The image is built from this repository, never pulled from a registry.
    build:
      context: ..
    pull_policy: build
    container_name: vigortally
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${VIGORTALLY_PORT:-8080}:8080'
    environment:
      DATABASE_URL: postgres://vigortally:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/vigortally
      PUBLIC_URL: ${PUBLIC_URL:-}
      TZ: ${TZ:-UTC}

  db:
    image: postgres:17-alpine
    container_name: vigortally-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vigortally
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: vigortally
    volumes:
      - vigortally-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vigortally']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  vigortally-pg:
